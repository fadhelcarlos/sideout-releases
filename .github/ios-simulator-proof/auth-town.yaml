appId: com.sideoutpr.app
name: Signed-out player and Business town selector
---
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "Ya tengo cuenta"
    timeout: 30000
- takeScreenshot: 00-player-door
- tapOn: "Ya tengo cuenta"
- assertVisible: "usuario"
- assertVisible: "Contraseña"
- takeScreenshot: 01-player-auth-keyboard
- hideKeyboard
- takeScreenshot: 02-player-auth-blank
# Relaunch preserves storage; no account was entered or created. NativeAuth's
# unpersisted screen returns to the welcome door while hasAccount remains absent.
- stopApp
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible: ".*Tienes una sede u organizas.*"
    timeout: 30000
- tapOn: ".*Tienes una sede u organizas.*"
- assertVisible: "Ya tengo cuenta Business"
- takeScreenshot: 03-business-door
- tapOn: "Ya tengo cuenta Business"
- assertVisible: "tu@sede.com"
- assertVisible: "Contraseña"
- takeScreenshot: 04-business-auth-keyboard
- hideKeyboard
- takeScreenshot: 05-business-auth-blank
# The selected account mode survives; BizAuth's local login screen does not.
- stopApp
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "Crear cuenta Business"
    timeout: 30000
- tapOn: "Crear cuenta Business"
# iOS groups glyph, title and subtitle into one accessibility label.
- tapOn: ".*Sede u organizador.*"
- tapOn: "Siguiente"
- assertVisible: "Nombre"
- tapOn: ".*Pueblo.*"
- assertVisible: "¿En qué pueblo?"
- assertVisible: "Busca tu pueblo"
- takeScreenshot: 06-town-full-list
- tapOn: "Busca tu pueblo"
# Keep the search value distinct from the result row we select.
- inputText: "San J"
- assertVisible: "San Juan"
- takeScreenshot: 07-town-search-keyboard
- tapOn: "San Juan"
- assertNotVisible: "¿En qué pueblo?"
- assertVisible: "Nombre"
- assertVisible: ".*San Juan.*"
- takeScreenshot: 08-town-selected
- tapOn: ".*San Juan.*"
- assertVisible: "¿En qué pueblo?"
- takeScreenshot: 09-town-reopened
- swipe:
    from:
      text: "¿En qué pueblo?"
    direction: DOWN
- assertNotVisible: "¿En qué pueblo?"
- assertVisible: "Nombre"
- assertVisible: ".*San Juan.*"
- takeScreenshot: 10-town-gesture-dismissed
- tapOn: ".*San Juan.*"
- assertVisible: "¿En qué pueblo?"
- tapOn: "Cerrar"
- assertNotVisible: "¿En qué pueblo?"
- assertVisible: "Nombre"
- assertVisible: ".*San Juan.*"
- takeScreenshot: 11-town-close-retained
# No name, email, username, password, terms, sign-in or signup submission occurs.
