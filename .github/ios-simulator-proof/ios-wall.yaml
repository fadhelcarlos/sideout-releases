appId: com.sideoutpr.app
name: Local forced iOS floor and real browser alternative
# Completion runs after pass or failure, preserving return evidence when CI cannot load the page.
onFlowComplete:
  - tapOn:
      text: "^(Done|OK|Listo)$"
      optional: true
  - assertVisible: "Abrir sideout en el navegador"
  - takeScreenshot: 20-ios-wall-returned
---
# Only the runner-local ll_native_release response was changed. No production
# floor, TestFlight state, account or provider is modified.
- stopApp
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible: "Abrir sideout en el navegador"
    timeout: 30000
- assertVisible: "Esta versión ya no se puede conectar. Escríbenos si no puedes actualizar."
- assertVisible: "Escríbenos"
- assertNotVisible: "Actualizar"
- takeScreenshot: 18-ios-wall-alternatives
- tapOn: "Abrir sideout en el navegador"
- extendedWaitUntil:
    visible: ".*sideoutpr.com.*"
    timeout: 30000
# Opening the system browser alone is partial evidence; this frame preserves it.
- takeScreenshot: 18-ios-wall-browser-opening
# NativeAuth exposes this operational button on a fresh, signed-out /app page.
# A timeout leaves content recovery unproven; it is not itself a product defect.
- extendedWaitUntil:
    visible: "^Ya tengo cuenta$"
    timeout: 30000
- takeScreenshot: 19-ios-wall-browser-opened
# No web form is entered or submitted.
