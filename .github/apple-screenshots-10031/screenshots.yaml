appId: com.sideoutpr.app
name: Recover authentic native iOS Torneito screenshot
---
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible: '^Ya tengo cuenta$'
    timeout: 30000
- tapOn: '^Ya tengo cuenta$'
- extendedWaitUntil:
    visible: '^usuario$'
    timeout: 30000
- tapOn: '^usuario$'
- inputText: lucasrivera
- tapOn: Contraseña
- inputText: Cancha2026!
- hideKeyboard
- tapOn:
    text: Entrar
    index: 1
- extendedWaitUntil:
    visible: '^Yo$'
    timeout: 30000
- assertNotVisible: Esto es sideout
- extendedWaitUntil:
    visible: '.*Tu PRIME.*'
    timeout: 30000
- assertNotVisible: '^Open in .*sideout.*'
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: '^Jugar$'
- extendedWaitUntil:
    visible: '^Cerrar$'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: '61%,48%'
- waitForAnimationToEnd:
    timeout: 5000
- runScript:
    file: capture.js
    env:
      SHOT: 03-torneito

