name: iOS Simulator cached 10029 unmet proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: macos-26
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify and retrieve the exact retained Simulator app
        env:
          GH_TOKEN: ${{ github.token }}
        run: node runner/.github/ios-simulator-replay/download.cjs "$RUNNER_TEMP/sideout-ios-cached-replay"
      - name: Replay only town, onboarding and native Copy independently
        run: bash runner/.github/ios-simulator-replay/run.sh "$RUNNER_TEMP/sideout-ios-cached-replay"
      - name: Preserve this replay under its own run identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-cached-unmet-10029-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sideout-ios-cached-replay/**
            !${{ runner.temp }}/sideout-ios-cached-replay/inherited/**
            !${{ runner.temp }}/sideout-ios-cached-replay/app/**
            !${{ runner.temp }}/sideout-ios-cached-replay/source-artifact.zip
          if-no-files-found: error
      - name: Shut down only Simulators created by this replay
        if: always()
        shell: bash
        run: |
          ids="$RUNNER_TEMP/sideout-ios-cached-replay/simulator-ids.txt"
          if [ -f "$ids" ]; then
            while IFS= read -r id; do
              [[ "$id" =~ ^[A-Fa-f0-9-]{36}$ ]] || exit 1
              xcrun simctl shutdown "$id" || true
            done < "$ids"
          fi
