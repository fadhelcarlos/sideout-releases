name: iOS Simulator native-only driver proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: macos-26
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mobile-dev-inc/Maestro
          ref: c8c361be1cc89b2e742f185466a302a22778be6b
          path: maestro-native
          sparse-checkout: maestro-ios-xctest-runner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify and retrieve the exact retained Simulator app
        env:
          GH_TOKEN: ${{ github.token }}
        run: node runner/.github/ios-simulator-replay/download.cjs "$RUNNER_TEMP/sideout-ios-native-driver-replay"
      - name: Replay only onboarding and native Copy independently
        run: bash runner/.github/ios-simulator-replay/run.sh "$RUNNER_TEMP/sideout-ios-native-driver-replay"
      - name: Preserve only owned Maestro debug logs including hidden entries
        if: always()
        shell: bash
        run: |
          for kind in onboarding copy; do
            case_dir="$RUNNER_TEMP/sideout-ios-native-driver-replay/$kind"
            if [ -d "$case_dir/maestro-debug" ]; then
              tar -czf "$case_dir/maestro-debug.tar.gz" -C "$case_dir" maestro-debug
              shasum -a 256 "$case_dir/maestro-debug.tar.gz" > "$case_dir/maestro-debug.tar.gz.sha256"
            fi
          done
      - name: Preserve this replay under its own run identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-driver-unmet-10029-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sideout-ios-native-driver-replay/**
            !${{ runner.temp }}/sideout-ios-native-driver-replay/inherited/**
            !${{ runner.temp }}/sideout-ios-native-driver-replay/app/**
            !${{ runner.temp }}/sideout-ios-native-driver-replay/source-artifact.zip
          if-no-files-found: error
      - name: Shut down only Simulators created by this replay
        if: always()
        shell: bash
        run: |
          ids="$RUNNER_TEMP/sideout-ios-native-driver-replay/simulator-ids.txt"
          if [ -f "$ids" ]; then
            while IFS= read -r id; do
              [[ "$id" =~ ^[A-Fa-f0-9-]{36}$ ]] || exit 1
              xcrun simctl shutdown "$id" || true
            done < "$ids"
          fi
