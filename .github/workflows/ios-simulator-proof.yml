name: iOS Simulator cached 10030 unmet proof
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source of the retained10030 Simulator app
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  simulator:
    runs-on: macos-26
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:8787
      EXPO_PUBLIC_SUPABASE_KEY: sideout-simulator-local-public-key
      EXPO_PUBLIC_ORIGIN: https://sideoutpr.com
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retrieve and verify the exact retained10030 app without compilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node runner/.github/ios-simulator-replay-10030/download.cjs "$RUNNER_TEMP/sideout-ios-cached-10030"
      - uses: actions/checkout@v4
        with:
          repository: mobile-dev-inc/Maestro
          ref: c8c361be1cc89b2e742f185466a302a22778be6b
          path: maestro-native
          sparse-checkout: maestro-ios-xctest-runner
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run only independent onboarding and native Copy against retained app
        shell: bash
        run: bash runner/.github/ios-simulator-replay-10030/run.sh "$RUNNER_TEMP/sideout-ios-cached-10030"
      - name: Preserve owned Maestro debug logs including hidden entries
        if: always()
        shell: bash
        run: |
          for kind in onboarding copy; do
            case_dir="$RUNNER_TEMP/sideout-ios-cached-10030/$kind"
            if [ -d "$case_dir/maestro-debug" ]; then
              tar -czf "$case_dir/maestro-debug.tar.gz" -C "$case_dir" maestro-debug
              shasum -a 256 "$case_dir/maestro-debug.tar.gz" > "$case_dir/maestro-debug.tar.gz.sha256"
            fi
          done
      - name: Preserve replay evidence under this run identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-cached-10030-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sideout-ios-cached-10030
            !${{ runner.temp }}/sideout-ios-cached-10030/app
            !${{ runner.temp }}/sideout-ios-cached-10030/inherited
            !${{ runner.temp }}/sideout-ios-cached-10030/source-artifact.zip
          if-no-files-found: error
      - name: Shut down only Simulators created by this proof
        if: always()
        shell: bash
        run: |
          ids="$RUNNER_TEMP/sideout-ios-cached-10030/simulator-ids.txt"
          if [ -f "$ids" ]; then
            while IFS= read -r id; do
              [[ "$id" =~ ^[A-Fa-f0-9-]{36}$ ]] || exit 1
              xcrun simctl shutdown "$id" || true
            done < "$ids"
          fi
