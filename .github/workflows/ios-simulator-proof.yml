name: Authentic iOS screenshots 10031
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source6151ee8a341c0e5cffe1a7f4b95ded2f3d004ba7
        required: true
        type: string
      phase:
        description: Build once or capture using that verified Simulator artifact
        required: true
        default: build
        type: choice
        options: [build, capture, package]
      app_artifact_id:
        description: Required only for capture
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  simulator:
    if: inputs.phase != 'package'
    runs-on: macos-26
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:8787
      EXPO_PUBLIC_SUPABASE_KEY: sideout-simulator-local-public-key
      EXPO_PUBLIC_ORIGIN: https://sideoutpr.com
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact build source
        run: node runner/.github/apple-screenshots-10031/verify.cjs input
      - uses: actions/checkout@v4
        if: inputs.phase == 'build'
        with:
          repository: fadhelcarlos/sideout-native
          token: ${{ secrets.SRC_TOKEN }}
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Build unsigned Simulator application
        if: inputs.phase == 'build'
        run: bash runner/.github/apple-screenshots-10031/build.sh source "$RUNNER_TEMP/apple-screenshots-build"
      - uses: actions/checkout@v4
        if: inputs.phase == 'capture'
        with:
          repository: mobile-dev-inc/Maestro
          ref: c8c361be1cc89b2e742f185466a302a22778be6b
          path: maestro-native
          sparse-checkout: maestro-ios-xctest-runner
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: inputs.phase == 'capture'
        with:
          distribution: temurin
          java-version: "17"
      - name: Navigate and capture seven native screens
        if: inputs.phase == 'capture'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ARTIFACT_ID: ${{ inputs.app_artifact_id }}
        run: bash runner/.github/apple-screenshots-10031/capture.sh "$RUNNER_TEMP/apple-screenshots-capture"
      - name: Preserve source-bound build evidence
        if: always() && inputs.phase == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: apple-screenshots-app-10031-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-screenshots-build
          if-no-files-found: error
      - name: Preserve raw seven screenshots and evidence
        if: always() && inputs.phase == 'capture'
        uses: actions/upload-artifact@v4
        with:
          name: apple-native-screenshots-10031-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apple-screenshots-capture
            !${{ runner.temp }}/apple-screenshots-capture/inherited
            !${{ runner.temp }}/apple-screenshots-capture/app
            !${{ runner.temp }}/apple-screenshots-capture/source-artifact.zip
          if-no-files-found: error
  delivery:
    if: inputs.phase == 'package'
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact source
        run: node .github/apple-screenshots-10031/verify.cjs input
      - name: Install PNG codec
        run: python -m pip install Pillow==12.3.0
      - name: Preserve originals and verify pixel-identical RGB copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/apple-screenshots-10031/package.py --output "$RUNNER_TEMP/apple-screenshots-delivery"
      - name: Publish seven screenshots and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: apple-native-screenshots-10031-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-screenshots-delivery
          if-no-files-found: error
